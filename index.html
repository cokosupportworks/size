 data-ratio=\"100\" class=\"ratio-preset-btn py-1.5 rounded-xl text-xs font-semibold border border-indigo-200 bg-indigo-50 text-indigo-700 transition border-indigo-500\" style=\"position: relative !important; left: 137.125px !important; top: -39.7074px !important; width: 40px !important;\">100%\u003c/button>\n                            \u003cbutton type=\"button\" data-ratio=\"150\" class=\"ratio-preset-btn py-1.5 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-600 text-slate-700 transition\" style=\"position: relative !important; left: 114.193px !important; top: -38.7703px !important; width: 40px !important;\">150%\u003c/button>\n                            \u003cbutton type=\"button\" data-ratio=\"200\" class=\"ratio-preset-btn py-1.5 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-600 text-slate-700 transition\" style=\"position: relative !important; left: 90.6828px !important; top: -39.4077px !important; width: 40px !important;\">200%\u003c/button>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/section>\n\n                \u003c!-- Card 3: Rounding Settings -->\n                \n            \u003c/div>\n\n            \u003c!-- Right Column: Result Display & Visual Preview -->\n            \u003cdiv id=\"right-col\" class=\"lg:col-span-5 space-y-6 w-full\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" style=\"overflow: hidden !important; clip-path: inset(0px) !important; width: 294.961px !important; height: 143.977px !important; left: -3.5467px; position: relative; top: -195.123px;\" data-vb-layout-key=\"layout-8\">\n                \n                \u003c!-- Result Card -->\n                \u003csection class=\"widget-compact-card bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 rounded-2xl p-5 sm:p-6 text-white shadow-xl shadow-indigo-500/15 relative overflow-hidden\" style=\"left: -0.21722px; top: -1.75543px; width: 294.966px !important; height: 138.695px !important; padding: 9.764px !important; overflow: hidden !important; clip-path: inset(0px round 16px) !important;\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" data-vb-layout-key=\"layout-7\">\n                    \u003cdiv class=\"hide-in-widget flex items-center justify-between mb-3\">\n                        \u003ch2 class=\"text-xs font-bold uppercase tracking-wider text-indigo-200 flex items-center gap-1.5\">\n                            \u003cspan class=\"w-2 h-2 rounded-full bg-emerald-400 animate-pulse\">\u003c/span>\n                            計算結果サイズ (逆算入力可)\n                        \u003c/h2>\n                        \u003cspan id=\"diff-badge\" class=\"text-[11px] font-semibold bg-white/15 backdrop-blur-sm px-2 py-0.5 rounded-full text-indigo-100\">+0 px / +0 px\u003c/span>\n                    \u003c/div>\n\n                    \u003c!-- Result Width & Height Boxes -->\n                    \u003cdiv class=\"grid grid-cols-2 gap-2 my-1 sm:my-3\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" style=\"overflow: hidden !important; clip-path: inset(0px) !important;\">\n                        \u003c!-- Result Width -->\n                        \u003cdiv class=\"bg-white/10 backdrop-blur-md border border-white/15 rounded-lg p-2 sm:p-3 transition focus-within:bg-white/20 focus-within:border-white/40\" style=\"width: 121.462px !important; height: 76.9922px !important; overflow: hidden !important; clip-path: inset(0px round 8px) !important; position: relative !important; left: 3.3039px !important; top: 0px !important;\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\">\n                            \u003cdiv class=\"flex items-center justify-between text-[10px] text-indigo-200 mb-0.5\">\n                                \u003cspan>計算後の幅 (W)\u003c/span>\n                                \u003cbutton type=\"button\" id=\"copy-w-btn\" class=\"hover:text-white underline\">コピー\u003c/button>\n                            \u003c/div>\n                            \u003cdiv class=\"flex items-baseline gap-1\">\n                                \u003cinput type=\"number\" id=\"result-width\" value=\"1920\" min=\"1\" step=\"any\" class=\"w-full bg-transparent text-lg sm:text-2xl font-extrabold text-white outline-none font-mono\" title=\"ここに目標の幅を入力すると比率を自動逆算します\" style=\"font-size: 17px !important;\">\n                                \u003cspan class=\"text-[10px] font-semibold text-indigo-200\">px\u003c/span>\n                            \u003c/div>\n                        \u003c/div>\n\n                        \u003c!-- Result Height -->\n                        \u003cdiv class=\"bg-white/10 backdrop-blur-md border border-white/15 rounded-lg p-2 sm:p-3 transition focus-within:bg-white/20 focus-within:border-white/40\" style=\"width: 127.691px !important; height: 75.9766px !important; overflow: hidden !important; clip-path: inset(0px round 8px) !important; position: relative !important; left: 4.68894px !important; top: 0px !important;\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\">\n                            \u003cdiv class=\"flex items-center justify-between text-[10px] text-indigo-200 mb-0.5\">\n                                \u003cspan>計算後の高さ (H)\u003c/span>\n                                \u003cbutton type=\"button\" id=\"copy-h-btn\" class=\"hover:text-white underline\">コピー\u003c/button>\n                            \u003c/div>\n                            \u003cdiv class=\"flex items-baseline gap-1\">\n                                \u003cinput type=\"number\" id=\"result-height\" value=\"1080\" min=\"1\" step=\"any\" class=\"w-full bg-transparent text-lg sm:text-2xl font-extrabold text-white outline-none font-mono\" title=\"ここに目標の高さを入力すると比率を自動逆算します\" style=\"font-size: 17px !important;\">\n                                \u003cspan class=\"text-[10px] font-semibold text-indigo-200\">px\u003c/span>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003c!-- Summary String & Copy Buttons -->\n                    \n                \u003c/section>\n\n                \u003c!-- Visual Scale Comparison Box (Hidden in Widget Mode) -->\n                \n\n                \u003c!-- Quick Reference Table (Hidden in Widget Mode) -->\n                \n\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cscript>\n        // Application State\n        const state = {\n            baseWidth: 1920,\n            baseHeight: 1080,\n            ratio: 100, // percentage\n            roundMode: 'round' // 'round' | 'floor' | 'ceil' | 'raw'\n        };\n\n        // DOM Elements\n        const baseWidthInput = document.getElementById('base-width');\n        const baseHeightInput = document.getElementById('base-height');\n        const swapBtn = document.getElementById('swap-btn');\n        const aspectRatioBadge = document.getElementById('aspect-ratio-badge');\n\n        const ratioInput = document.getElementById('ratio-input');\n        const widgetRatioInput = document.getElementById('widget-ratio-input');\n        const ratioSlider = document.getElementById('ratio-slider');\n        const extendSliderToggle = document.getElementById('extend-slider-toggle');\n        const sliderMaxLabel = document.getElementById('slider-max-label');\n        const multiplierBadge = document.getElementById('multiplier-badge');\n\n        const resultWidthInput = document.getElementById('result-width');\n        const resultHeightInput = document.getElementById('result-height');\n        const combinedResultText = document.getElementById('combined-result-text');\n        const diffBadge = document.getElementById('diff-badge');\n\n        const previewContainer = document.getElementById('preview-container');\n        const previewBaseBox = document.getElementById('preview-base-box');\n        const previewScaledBox = document.getElementById('preview-scaled-box');\n        const previewScaledLabel = document.getElementById('preview-scaled-label');\n\n        const referenceTableBody = document.getElementById('reference-table-body');\n        const toast = document.getElementById('toast');\n        const toastMessage = document.getElementById('toast-message');\n\n        // Helper: Greatest Common Divisor for Aspect Ratio\n        function gcd(a, b) {\n            a = Math.abs(Math.round(a));\n            b = Math.abs(Math.round(b));\n            if (b === 0) return a || 1;\n            return gcd(b, a % b);\n        }\n\n        // Helper: Apply rounding mode\n        function formatDimension(val) {\n            if (!isFinite(val) || val \u003c 0) return 0;\n            switch (state.roundMode) {\n                case 'round':\n                    return Math.round(val);\n                case 'floor':\n                    return Math.floor(val);\n                case 'ceil':\n                    return Math.ceil(val);\n                case 'raw':\n                    return Number(val.toFixed(2));\n                default:\n                    return Math.round(val);\n            }\n        }\n\n        // Core Calculation & UI Update\n        function updateCalculations(source = 'all') {\n            const w = Math.max(0, parseFloat(state.baseWidth) || 0);\n            const h = Math.max(0, parseFloat(state.baseHeight) || 0);\n            const r = Math.max(0, parseFloat(state.ratio) || 0);\n\n            const scale = r / 100;\n            const newW = formatDimension(w * scale);\n            const newH = formatDimension(h * scale);\n\n            // Sync Inputs depending on trigger source so user editing a single digit isn't interrupted\n            if (source !== 'baseWidth' && baseWidthInput) baseWidthInput.value = w;\n            if (source !== 'baseHeight' && baseHeightInput) baseHeightInput.value = h;\n            if (source !== 'ratioInput' && ratioInput) {\n                ratioInput.value = Number(r.toFixed(2));\n            }\n            if (source !== 'widgetRatioInput' && widgetRatioInput) {\n                widgetRatioInput.value = Number(r.toFixed(1));\n            }\n            if (source !== 'ratioSlider' && ratioSlider) {\n                ratioSlider.value = Math.min(Math.max(r, 1), parseFloat(ratioSlider.max));\n            }\n            if (source !== 'resultWidth' && resultWidthInput) {\n                resultWidthInput.value = newW;\n            }\n            if (source !== 'resultHeight' && resultHeightInput) {\n                resultHeightInput.value = newH;\n            }\n\n            // Highlight active 200px step button if matched\n            document.querySelectorAll('[data-pick-target=\"base-width\"]').forEach(btn => {\n                const val = parseFloat(btn.dataset.pickVal);\n                btn.classList.toggle('bg-indigo-600', val === w);\n                btn.classList.toggle('text-white', val === w);\n                btn.classList.toggle('bg-slate-100', val !== w);\n            });\n            document.querySelectorAll('[data-pick-target=\"base-height\"]').forEach(btn => {\n                const val = parseFloat(btn.dataset.pickVal);\n                btn.classList.toggle('bg-indigo-600', val === h);\n                btn.classList.toggle('text-white', val === h);\n                btn.classList.toggle('bg-slate-100', val !== h);\n            });\n\n            // Aspect Ratio Badge\n            if (aspectRatioBadge) {\n                if (w > 0 && h > 0) {\n                    const divisor = gcd(w, h);\n                    const arW = Math.round(w / divisor);\n                    const arH = Math.round(h / divisor);\n                    aspectRatioBadge.textContent = `アスペクト比 ${arW} : ${arH}`;\n                } else {\n                    aspectRatioBadge.textContent = `アスペクト比 - : -`;\n                }\n            }\n\n            // Multiplier & Area Percentage\n            if (multiplierBadge) {\n                const areaRatio = Math.round(scale * scale * 100);\n                multiplierBadge.textContent = `倍率: ${scale.toFixed(2)}x (面積比: ${areaRatio}%)`;\n            }\n\n            // Combined Text & Diff Badge\n            if (combinedResultText) combinedResultText.textContent = `${newW} x ${newH}`;\n            if (diffBadge) {\n                const diffW = formatDimension(newW - w);\n                const diffH = formatDimension(newH - h);\n                const signW = diffW >= 0 ? `+${diffW}` : `${diffW}`;\n                const signH = diffH >= 0 ? `+${diffH}` : `${diffH}`;\n                diffBadge.textContent = `${signW} px / ${signH} px`;\n            }\n\n            // Update Visual Preview\n            updateVisualPreview(w, h, newW, newH);\n\n            // Update Quick Reference Table\n            updateReferenceTable(w, h);\n\n            // Highlight active preset ratio button if matched\n            document.querySelectorAll('.ratio-preset-btn').forEach(btn => {\n                const presetVal = parseFloat(btn.dataset.ratio);\n                if (Math.abs(presetVal - r) \u003c 0.05) {\n                    btn.classList.add('border-indigo-500', 'bg-indigo-50', 'text-indigo-700');\n                } else {\n                    btn.classList.remove('border-indigo-500', 'bg-indigo-50', 'text-indigo-700');\n                }\n            });\n        }\n\n        // Visual Preview Renderer\n        function updateVisualPreview(baseW, baseH, scaledW, scaledH) {\n            if (baseW \u003c= 0 || baseH \u003c= 0) return;\n            if (!previewContainer || !previewBaseBox || !previewScaledBox || !previewScaledLabel) return;\n\n            const containerWidth = previewContainer.clientWidth - 40;\n            const containerHeight = previewContainer.clientHeight - 40;\n\n            // Determine maximum bounding box between original and scaled so both fit inside the preview\n            const maxW = Math.max(baseW, scaledW, 1);\n            const maxH = Math.max(baseH, scaledH, 1);\n\n            const fitScale = Math.min(containerWidth / maxW, containerHeight / maxH);\n\n            const drawBaseW = Math.max(4, Math.round(baseW * fitScale));\n            const drawBaseH = Math.max(4, Math.round(baseH * fitScale));\n            const drawScaledW = Math.max(4, Math.round(scaledW * fitScale));\n            const drawScaledH = Math.max(4, Math.round(scaledH * fitScale));\n\n            previewBaseBox.style.width = `${drawBaseW}px`;\n            previewBaseBox.style.height = `${drawBaseH}px`;\n\n            previewScaledBox.style.width = `${drawScaledW}px`;\n            previewScaledBox.style.height = `${drawScaledH}px`;\n            previewScaledLabel.textContent = `${scaledW}×${scaledH}`;\n        }\n\n        // Populate Reference Table for quick comparison\n        function updateReferenceTable(baseW, baseH) {\n            if (!referenceTableBody) return;\n            const sampleRatios = [25, 50, 75, 125, 150, 200];\n            referenceTableBody.innerHTML = '';\n\n            sampleRatios.forEach(r => {\n                const w = formatDimension(baseW * (r / 100));\n                const h = formatDimension(baseH * (r / 100));\n                const isCurrent = Math.abs(state.ratio - r) \u003c 0.05;\n\n                const tr = document.createElement('tr');\n                tr.className = isCurrent ? 'bg-indigo-50/80 font-bold text-indigo-700' : 'hover:bg-slate-50';\n                tr.innerHTML = `\n                    \u003ctd class=\"py-2\">${r}%\u003c/td>\n                    \u003ctd class=\"py-2\">${w} px\u003c/td>\n                    \u003ctd class=\"py-2\">${h} px\u003c/td>\n                    \u003ctd class=\"py-2 text-right\">\n                        \u003cbutton type=\"button\" data-apply-ratio=\"${r}\" class=\"px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-600 text-[11px] font-sans font-medium transition\">\n                            選択\n                        \u003c/button>\n                    \u003c/td>\n                `;\n                referenceTableBody.appendChild(tr);\n            });\n\n            // Bind apply buttons inside table\n            referenceTableBody.querySelectorAll('[data-apply-ratio]').forEach(btn => {\n                btn.addEventListener('click', () => {\n                    state.ratio = parseFloat(btn.dataset.applyRatio);\n                    updateCalculations();\n                });\n            });\n        }\n\n        // Copy to Clipboard Utility (using execCommand for iframe compatibility)\n        function copyToClipboard(text, label) {\n            const textarea = document.createElement('textarea');\n            textarea.value = text;\n            textarea.style.position = 'fixed';\n            textarea.style.opacity = '0';\n            document.body.appendChild(textarea);\n            textarea.select();\n            try {\n                document.execCommand('copy');\n                showToast(`${label} (${text}) をコピーしました`);\n            } catch (err) {\n                showToast('コピーに失敗しました');\n            }\n            document.body.removeChild(textarea);\n        }\n\n        let toastTimeout;\n        function showToast(msg) {\n            if (!toast || !toastMessage) return;\n            toastMessage.textContent = msg;\n            toast.classList.remove('translate-y-20', 'opacity-0');\n            clearTimeout(toastTimeout);\n            toastTimeout = setTimeout(() => {\n                toast.classList.add('translate-y-20', 'opacity-0');\n            }, 2200);\n        }\n\n        // Build 200px Step Quick Picker Lists (200px to 4000px)\n        function initStepPickers() {\n            const widthGrid = document.getElementById('width-picker-grid');\n            const heightGrid = document.getElementById('height-picker-grid');\n            if (!widthGrid || !heightGrid) return;\n            \n            const steps = [];\n            for (let v = 200; v \u003c= 4000; v += 200) {\n                steps.push(v);\n            }\n\n            function populateGrid(gridEl, targetId, menuId) {\n                gridEl.innerHTML = '';\n                steps.forEach(val => {\n                    const btn = document.createElement('button');\n                    btn.type = 'button';\n                    btn.dataset.pickTarget = targetId;\n                    btn.dataset.pickVal = val;\n                    btn.className = 'py-1.5 px-1 rounded-lg text-xs font-mono font-bold bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 text-slate-700 transition text-center';\n                    btn.textContent = val;\n                    btn.addEventListener('click', () => {\n                        const inputEl = document.getElementById(targetId);\n                        if (targetId === 'base-width') {\n                            state.baseWidth = val;\n                        } else {\n                            state.baseHeight = val;\n                        }\n                        updateCalculations();\n                        const menuEl = document.getElementById(menuId);\n                        if (menuEl) menuEl.classList.add('hidden');\n                        // Focus the input so user can immediately edit any digit if desired\n                        if (inputEl) inputEl.focus();\n                    });\n                    gridEl.appendChild(btn);\n                });\n            }\n\n            populateGrid(widthGrid, 'base-width', 'width-picker');\n            populateGrid(heightGrid, 'base-height', 'height-picker');\n\n            // Toggle Picker Menus\n            document.querySelectorAll('[data-picker-toggle]').forEach(btn => {\n                btn.addEventListener('click', (e) => {\n                    e.stopPropagation();\n                    const targetMenuId = btn.dataset.pickerToggle;\n                    const menu = document.getElementById(targetMenuId);\n                    if (!menu) return;\n                    const isHidden = menu.classList.contains('hidden');\n                    document.querySelectorAll('.step-picker-menu').forEach(m => m.classList.add('hidden'));\n                    if (isHidden) {\n                        menu.classList.remove('hidden');\n                    }\n                });\n            });\n\n            // Close buttons inside picker\n            document.querySelectorAll('.close-picker-btn').forEach(btn => {\n                btn.addEventListener('click', () => {\n                    document.querySelectorAll('.step-picker-menu').forEach(m => m.classList.add('hidden'));\n                });\n            });\n\n            // Click outside to close picker\n            document.addEventListener('click', (e) => {\n                if (!e.target.closest('.step-picker-menu') && !e.target.closest('[data-picker-toggle]')) {\n                    document.querySelectorAll('.step-picker-menu').forEach(m => m.classList.add('hidden'));\n                }\n            });\n        }\n\n        // View Mode (Full vs Corner Widget) & Draggable/Snap Support\n        const appWrapper = document.getElementById('app-wrapper');\n        const modeFullBtn = document.getElementById('mode-full-btn');\n        const modeWidgetBtn = document.getElementById('mode-widget-btn');\n        const exitWidgetBtn = document.getElementById('exit-widget-btn');\n        const openPopupWindowBtn = document.getElementById('open-popup-window-btn');\n        const widgetPopoutBtn = document.getElementById('widget-popout-btn');\n        const widge
